{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h3 class="fw-bold text-center mb-4 text-dark">📝 ĐĂNG KÝ TÀI KHOẢN KHÁCH HÀNG</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Họ và tên</label>
                    <input type="text" name="fullname" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="mb-2 row">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Số điện thoại</label>
                        <input type="text" name="phone" class="form-control" placeholder="09xxxxxxxx" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="name@gmail.com" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Địa chỉ nhận hàng</label>
                    <input type="text" name="address" class="form-control" placeholder="Số nhà, đường, quận, thành phố" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Mật khẩu bảo mật</label>
                    <input type="password" name="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">Tạo Tài Khoản</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
